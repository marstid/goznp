# golangci-lint configuration for goznp
# See https://golangci-lint.run/usage/configuration/

linters:
  enable:
    - errcheck            # Check for unchecked errors
    - gosimple            # Simplify code
    - govet               # Vet examines Go source code and reports suspicious constructs
    - ineffassign         # Find ineffectual assignments
    - staticcheck         # Comprehensive static analysis
    - typecheck           # Typecheck package
    - unused              # Check for unused constants, variables, functions and types
    # - gocyclo           # Disabled - many complex functions are intentional
    - gocritic            # Provides diagnostics that check for bugs, performance and style issues
    # - godot             # Disabled - too many existing comments without periods
    - gofmt               # Check code formatting
    - goimports           # Check import statements are formatted correctly
    - misspell            # Find commonly misspelled English words
    - revive              # Fast, configurable, extensible, flexible, and beautiful linter
    - unconvert           # Remove unnecessary type conversions
    - unparam             # Detect unused function parameters
    - whitespace          # Detection of leading and trailing whitespace

  disable:
    - exhaustruct         # Not needed - using field names is clearer
    - gosec               # Moved to separate security workflow
    - nlreturn            # Too strict for our style
    - prealloc            # Can hurt readability for little gain
    - testpackage         # We use _test.go naming convention successfully
    - wsl                 # Too strict

linters-settings:
  errcheck:
    check-type-assertions: true
    check-blank: true

  gocyclo:
    min-complexity: 15

  govet:
    enable-all: true
    disable:
      - shadow           # We accept some intentional shadowing
      - fieldalignment   # Can hurt readability

  gocritic:
    enabled-tags:
      - diagnostic
      - experimental
      - opinionated
      - performance
      - style
    disabled-checks:
      - unnamedResult    # Named returns are useful
      - hugeParam        # Sometimes intentional for clarity
      - whyNoLint        # We use comments appropriately
      - paramTypeCombine # Explicit parameter types are clearer

  revive:
    rules:
      - name: blank-imports
      - name: context-as-argument
      - name: context-keys-type
      - name: dot-imports
      - name: error-return
      - name: error-strings
      - name: error-naming
      - name: exported
      - name: if-return
      - name: increment-decrement
      - name: var-naming
      - name: var-declaration
      - name: package-comments
      - name: range
      - name: receiver-naming
      - name: time-naming
      - name: unexported-return
      - name: indent-error-flow
      - name: errorf
      - name: empty-block
      - name: superfluous-else
      - name: unused-parameter
      - name: unreachable-code
      - name: redefines-builtin-id

  godot:
    scope: all
    exclude: [examples, testdata]

  misspell:
    locale: US

  goimports:
    local-prefixes: github.com/marstid/goznp

run:
  go: '1.23'
  timeout: 5m
  tests: true
  modules-download-mode: readonly

output:
  # Make output more readable
  formats:
    - format: colored-line-number
  print-issued-lines: true
  print-linter-name: true
  sort-results: true
